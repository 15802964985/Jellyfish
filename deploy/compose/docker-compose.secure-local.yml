services:
  backend-migrate:
    build:
      dockerfile: deploy/docker/backend.local.Dockerfile

  backend-seed-system-data:
    build:
      dockerfile: deploy/docker/backend.local.Dockerfile

  backend:
    # Optional local browser credential; absent on other installations means disabled.
    env_file:
      - path: ../../local-browser/runner.env
        required: false
    build:
      dockerfile: deploy/docker/backend.local.Dockerfile
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  celery-worker:
    build:
      dockerfile: deploy/docker/backend.local.Dockerfile

  celery-beat:
    build:
      dockerfile: deploy/docker/backend.local.Dockerfile

  front:
    # Host collector publishes only inventory; nginx exposes one exact JSON file.
    volumes:
      - ../../local-reports:/var/lib/jellyfish-inventory:ro
    build:
      dockerfile: deploy/docker/front.local.Dockerfile
    ports: !override
      - "127.0.0.1:${FRONT_PORT:-7788}:80"

  mysql:
    ports: !override
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports: !override
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  rustfs:
    ports: !override
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"

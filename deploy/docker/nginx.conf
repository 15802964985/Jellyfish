server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Ensure runtime env is not cached aggressively
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # index.html contains the current hashed JS/CSS entry names.  It must never
  # be reused after a container upgrade, otherwise users keep seeing the old UI.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  # /assets is also a React route. Do not let the Vite assets directory
  # redirect it to /assets/ (which drops the published port in Docker).
  location = /assets {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }
  location = /assets/ {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  # Only the sanitized inventory is served, never other local reports or Docker control.
  location = /local-inventory/docker-images.json {
    alias /var/lib/jellyfish-inventory/docker-inventory.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }
  location /local-inventory/ { return 404; }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}


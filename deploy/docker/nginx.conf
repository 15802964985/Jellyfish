server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Ensure runtime env is not cached aggressively
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # index.html contains the current hashed JS/CSS entry names.  It must never
  # be reused after a container upgrade, otherwise users keep seeing the old UI.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}

